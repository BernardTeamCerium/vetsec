<svg width="268" height="54" viewBox="0 0 268 54" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vet-Sec Protection Agency">
  <defs>
    <clipPath id="shield"><path d="M6 7H42V28C42 41 33 48 24 51C15 48 6 41 6 28Z"/></clipPath>
  </defs>
  <!-- shield base -->
  <g clip-path="url(#shield)">
    <rect x="6" y="7" width="36" height="44" fill="#FFFFFF"/>
    <!-- chief (blue) -->
    <rect x="6" y="7" width="36" height="13" fill="#1B3A6B"/>
    <!-- red/white stripes -->
    <rect x="6" y="20" width="36" height="31" fill="#FFFFFF"/>
    <rect x="6" y="20" width="6" height="31" fill="#C8102E"/>
    <rect x="18" y="20" width="6" height="31" fill="#C8102E"/>
    <rect x="30" y="20" width="6" height="31" fill="#C8102E"/>
  </g>
  <!-- stars in chief -->
  <g fill="#FFFFFF">
    <path d="M13 10.4l.7 2.1h2.2l-1.8 1.3.7 2.1-1.8-1.3-1.8 1.3.7-2.1-1.8-1.3h2.2z"/>
    <path d="M24 10.4l.7 2.1h2.2l-1.8 1.3.7 2.1-1.8-1.3-1.8 1.3.7-2.1-1.8-1.3h2.2z"/>
    <path d="M35 10.4l.7 2.1h2.2l-1.8 1.3.7 2.1-1.8-1.3-1.8 1.3.7-2.1-1.8-1.3h2.2z"/>
  </g>
  <!-- shield outline -->
  <path d="M6 7H42V28C42 41 33 48 24 51C15 48 6 41 6 28Z" fill="none" stroke="#0F2138" stroke-width="2.2"/>
  <!-- S monogram -->
  <text x="24" y="42" text-anchor="middle" font-family="Montserrat, 'Arial Black', sans-serif" font-size="30" font-weight="700" fill="#0F2138" stroke="#FFFFFF" stroke-width="1.1" paint-order="stroke" style="letter-spacing:0">S</text>
  <!-- wordmark -->
  <text x="54" y="28" font-family="Montserrat, system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#0F2138">VET<tspan fill="#C8102E">·</tspan>SEC</text>
  <text x="55" y="43" font-family="Montserrat, system-ui, sans-serif" font-size="8.2" letter-spacing="2.9" fill="#5C6B7C">PROTECTION AGENCY</text>
</svg>
